spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bakery_db
    username: bakery_app_user
    password: app_pass_123
    driver-class-name: org.postgresql.Driver

jwt:
  secret: "change-me-super-secret-key-at-least-32-bytes-long!!"
  access-expiration-ms: 900000        # 15 минут
  refresh-expiration-ms: 604800000    # 7 дней

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/bakery_db
    user: bakery_migrator
    password: migrator_pass_123
    locations: classpath:db/migration
    baseline-on-migrate: true
    spring:
      flyway:
        enabled: true
        locations: classpath:db/migration